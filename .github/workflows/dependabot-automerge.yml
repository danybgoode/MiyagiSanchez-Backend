# Auto-merge dependabot's NON-MAJOR bumps once CI is green.
#
# Why this exists: on 2026-08-24 four dependabot PRs had been open 10–17 days, and the queue had gone
# stale enough that nobody was reading it — which is worse than no queue, because a real security bump
# would have sat in the same pile unnoticed. Routine patch/minor churn does not need a human; majors do,
# and this workflow deliberately never touches them (see `.github/dependabot.yml`'s ignore block for the
# React-family majors that are broken BY DESIGN in this repo).
#
# ⚠️ A merge to main builds the Medusa image (image-arm64.yml). Until 2026-10-16 it also deployed to Cloud Run
# unattended; on the Oracle VM a merged bump ships at the NEXT `infra/oci/update.sh` run, bundled with whatever
# else merged since. So this workflow still ships to production without a human reading the bump. That is the accepted trade, made explicitly by the product
# owner on 2026-08-24, and it is safe only because `main` requires the "Type-check + build + unit" check
# — the one that actually catches a broken dependency tree. `--auto` QUEUES the merge; GitHub holds it
# until that required check passes and drops it if the check fails. It never bypasses the gate.
#
# The `Lint` job is deliberately NOT part of the required set on main, so a lint-only failure will not
# hold a bump. That is a pre-existing branch-protection choice, recorded here so it is a decision rather
# than a surprise.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write        # queue the merge
  pull-requests: write   # approve, so the queued merge is not blocked on review

jobs:
  automerge:
    # pull_request_target runs with write creds against the BASE repo, so it must never run for a
    # non-dependabot author — that is the documented privilege-escalation shape for this trigger.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the bump's metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are the class this repo has actually been burned by: PR #140's react-dom 19 against
      # react 18 passed CI and would still have been a broken install. They stay human-reviewed.
      # NO `gh pr review --approve` here. The first cut of this workflow approved before merging, and
      # every run died on "GitHub Actions is not permitted to approve pull requests" — a repo/org
      # setting that GITHUB_TOKEN cannot override. Because the step runs under `bash -e`, that failure
      # aborted the step BEFORE the merge was queued, so auto-merge never armed once (observed on
      # PR #168, run 32794755387).
      #
      # The approve was unnecessary anyway: `main`'s protection requires the "Type-check + build +
      # unit" check and does NOT require reviews (verified via the branch-protection API — it has no
      # `required_pull_request_reviews`). If review-requiring protection is ever added, this needs a
      # PAT or a GitHub App, not GITHUB_TOKEN — do not reintroduce the approve step expecting it to
      # work.
      # ── What may merge itself, and why ───────────────────────────────────────────────────────
      # MAJORS never auto-merge. Semver majors are where an upgrade needs a person reading a
      # changelog, and this repo has the scars: react-dom 19 against react 18 passed CI green and
      # was still a broken install.
      #
      # The MEDUSA ENGINE now MAY, and that is a deliberate reversal of the position taken on
      # 2026-08-25 in #175. The reasoning then was sound and is worth preserving: Medusa versions
      # the whole commerce engine on 2.x, so a two-minor engine upgrade arrives labelled "minor" —
      # a single "minor-and-patch" PR once carried 68 @medusajs packages from 2.17.2 to 2.19.0, and
      # this workflow had already queued it for an unattended production deploy. What stopped it was
      # an UNRELATED red test. An accident, not a control.
      #
      # What changed is not the risk appetite, it is the evidence. `ci.yml`'s money-path job now
      # boots the real app against a real Postgres and drives real HTTP: a publishable key resolving
      # to exactly one sales channel, a cart created on it, a real variant priced, totals adding up,
      # the catalog served, and a keyless request refused. It is a REQUIRED check on `main`, so
      # `--auto` cannot merge past it — GitHub holds the merge until it passes and drops it if it
      # fails. The engine upgrade that could not be verified at all in August is now the exact thing
      # this gate proves on every PR.
      #
      # 🚨 The honest limit, so nobody assumes wider coverage than exists: that gate runs on the
      # in-memory cache/event-bus/workflow modules, because the Redis-backed ones do not survive the
      # test runner's snapshot/restore cycle (measured: deterministic failure, 3/3 runs). So
      # Redis-SPECIFIC behaviour — durable retryable workflows, the shared cache, distributed
      # locking that stops scheduled jobs double-firing — is still ungated. If a future incident
      # traces to one of those, this exclusion is the first thing to reconsider.
      - name: Queue the merge (everything except majors)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        # Both are REQUIRED and were lost once already: removing the `gh pr review --approve` line
        # collapsed a two-command `run: |` block into a one-liner and took this `env:` with it. The
        # result was `gh: To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
        # environment variable` — exit 4, and no merge ever queued. Same silent shape as the approve
        # bug it replaced: the workflow "ran", and nothing merged.
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why a major was left alone
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "::notice::${{ steps.meta.outputs.dependency-names }} is a MAJOR bump — left for human review, not auto-merged."
