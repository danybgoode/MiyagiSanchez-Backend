name: Notify Telegram

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Push notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CICD_CHAT_ID: ${{ secrets.TELEGRAM_CICD_CHAT_ID }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          ACTOR_HANDLE: ${{ github.actor }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          # Telegram is observability only; this step must never fail the workflow.
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CICD_CHAT_ID:-}" ]; then
            echo "Telegram CI/CD secrets are not configured; skipping notification."
            exit 0
          fi

          esc() {
            local s="${1:-}"
            s="${s//&/&amp;}"
            s="${s//</&lt;}"
            s="${s//>/&gt;}"
            printf '%s' "$s"
          }

          short_sha="${GITHUB_SHA:0:7}"
          commit_header="$(printf '%s' "${HEAD_COMMIT_MESSAGE:-Push to main}" | sed -n '1p')"
          if [ -z "$commit_header" ]; then
            commit_header="Push to main"
          fi
          commit_url="${HEAD_COMMIT_URL:-https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}}"

          # The commit's first plain paragraph — the "what changed" a merge is written to carry. Skips the
          # subject, GitHub's squash list ("* …" lines) and trailers. The VM's deploy ping (infra/oci/update.sh
          # in MiyagiSanchez-Product) reads the SAME paragraph with the same rule, so 📦 and 🚀 read as a pair.
          prose="$(printf '%s\n' "${HEAD_COMMIT_MESSAGE:-}" | awk '
            NR == 1 { next }
            /^[[:space:]]*$/ { if (p != "") { print p; done = 1; exit } skip = 0; next }
            skip { next }
            p == "" && ($0 ~ /^[*-] / || $0 ~ /^(Co-Authored-By|Claude-Session|Signed-off-by):/) { skip = 1; next }
            { sub(/^[[:space:]]+/, ""); p = (p == "" ? $0 : p " " $0) }
            END { if (!done && p != "") print p }')"
          if [ "${#prose}" -gt 600 ]; then prose="${prose:0:600}"; prose="${prose% *}…"; fi

          # "(#441)" at the end of a squash subject → a link to the PR.
          pr_number="$(printf '%s' "$commit_header" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
          pr_part=""
          if [ -n "$pr_number" ]; then
            pr_part=" · <a href=\"https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}\">PR #${pr_number}</a>"
          fi

          message="<b>$(esc "$REPOSITORY_NAME")</b> · 📦 · <code>$(esc "$short_sha")</code>
          $(esc "$commit_header")"
          if [ -n "$prose" ]; then
            message="${message}
          $(esc "$prose")"
          fi
          message="${message}
          Author: <code>$(esc "@$ACTOR_HANDLE")</code>${pr_part}
          <a href=\"$(esc "$commit_url")\">View commit diff</a>"

          curl --silent --connect-timeout 5 --max-time 10 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CICD_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            >/dev/null 2>&1 || true

          exit 0
